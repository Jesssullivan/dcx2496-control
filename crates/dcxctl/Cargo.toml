[package]
name = "dcxctl"
description = "Offline-by-default DCX2496 profile, REW, snapshot, and typed control CLI"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[features]
default = []
live-control = [
    "dep:dcx-darwin-tty",
    "dep:dcx-transport",
]
# Compatibility for callers pinned to the first live Search feature name.
live-discovery = ["live-control"]

[dependencies]
clap.workspace = true
dcx-core = { path = "../dcx-core", version = "=0.1.0" }
hex.workspace = true
serde_json.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
dcx-darwin-tty = { path = "../dcx-darwin-tty", version = "=0.1.0", optional = true }
dcx-transport = { path = "../dcx-transport", version = "=0.1.0", optional = true }

[lints]
workspace = true
