[package]
name = "dcx-darwin-tty"
description = "Fail-closed Darwin tty carrier for the typed DCX2496 Search operation"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
dcx-core = { path = "../dcx-core", version = "=0.1.0" }
dcx-transport = { path = "../dcx-transport", version = "=0.1.0" }
serde.workspace = true
sha2.workspace = true
thiserror.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc.workspace = true
rustix.workspace = true

[dev-dependencies]
serde_json.workspace = true

# Keep unsafe code denied across the carrier state machine. The only exception
# is the small macOS ABI module, which documents every ioctl/select call.
[lints.rust]
unsafe_code = "deny"
unexpected_cfgs = { level = "deny", check-cfg = ['cfg(bazel_test_no_native)'] }

[lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"
