# This hosted workflow is deliberately non-authoritative. Its result is not a
# product gate and never a DCX2496 control receipt. It runs the purpose-named
# `just hosted-advisory` lane provides static feedback under
# dec-local-first-reapi-20261004. It runs no Rust compile/test or Bazel workload.
# Eligible-host source receipts identify local versus explicit REAPI execution.
# Anything that touches a device, or that must run on one specific machine, is
# out of scope for this workflow and never runs on a hosted runner. TIN-4050
# carries the local-first source policy; provider enrollment is deferred.
name: Advisory

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hosted-advisory:
    name: Hosted advisory (non-authoritative)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: tinyland-inc/ci-templates/.github/actions/setup-nix@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - uses: tinyland-inc/ci-templates/.github/actions/nix-setup@d8d178c022a0f84853d53a2c8fe0fc90115f0949 # v3.1.0

      - name: Run the hosted advisory lane
        run: nix develop --no-write-lock-file --command just hosted-advisory
