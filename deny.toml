[advisories]
yanked = "deny"

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
  { crate = "arrayref@0.3.10", reason = "malicious crate release disclosed 2026-08-20" },
  { crate = "append-only-vec@0.1.9", reason = "malicious crate release disclosed 2026-08-20" },
  { crate = "internment@0.8.7", reason = "malicious crate release disclosed 2026-08-20" },
  { crate = "proc-macro1", reason = "malicious typosquat disclosed 2026-08-20" },
  { crate = "proc-macro-en", reason = "malicious typosquat disclosed 2026-08-20" },
  { crate = "aovine", reason = "malicious crate disclosed 2026-08-20" },
  { crate = "arone", reason = "malicious crate disclosed 2026-08-20" },
  { crate = "aronenao", reason = "malicious crate disclosed 2026-08-20" },
  { crate = "tinymember", reason = "malicious crate disclosed 2026-08-20" },
]

[licenses]
confidence-threshold = 0.93
allow = [
  "Apache-2.0",
  "MIT",
  "Unicode-3.0",
]

[sources]
unknown-git = "deny"
unknown-registry = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
