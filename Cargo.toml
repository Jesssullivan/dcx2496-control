[workspace]
members = [
    "crates/dcx-core",
    "crates/dcx-darwin-tty",
    "crates/dcx-transport",
    "crates/dcxctl",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT OR Apache-2.0"
authors = ["Jess Sullivan"]
repository = "https://github.com/Jesssullivan/dcx2496-control"

[workspace.dependencies]
clap = { version = "4.5.46", features = ["derive"] }
hex = "0.4.3"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
thiserror = "2.0.16"
libc = "0.2.189"
rustix = { version = "1.1.4", features = ["fs", "termios"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "deny", priority = -1 }
module_name_repetitions = "allow"
must_use_candidate = "allow"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"
